server:
  port: 8080

spring:
  application:
    name: school-management-backend

  datasource:
    url: jdbc:mysql://localhost:3306/school_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 2410
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
    open-in-view: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    secret: FYyaOLFDG19R7oEwu2LY3cFoMu7yJpKblazSVefJjCs=
    expiration-ms: 86400000
  file:
    upload-dir: ./uploads
    allowed-types: image/jpeg,image/png,image/jpg,application/pdf
    max-size-bytes: 5242880

logging:
  level:
    com.school.app: INFO
    org.springframework.security: WARN